# Prices are USD per 1,000,000 tokens.
# !!! The numbers below are PLACEHOLDERS. Replace them with the rates you
# actually pay / want to attribute. Keys are matched (case-insensitive) against
# the response model first, then the request model. Exact match wins, otherwise
# the longest key that is a prefix of the model name is used
# (so "gpt-4o" also prices "gpt-4o-2024-08-06").
currency: USD
models:
  gpt-4o:            { input_per_million: 2.50,  output_per_million: 10.00 }
  gpt-4o-mini:       { input_per_million: 0.15,  output_per_million: 0.60 }
  gpt-4.1:           { input_per_million: 2.00,  output_per_million: 8.00 }
  gpt-5.3-codex:     { input_per_million: 1.75,  output_per_million: 14.00 }
  gpt-6.1-sol:       { input_per_million: 2.00,  output_per_million: 10.00 }
  gpt-6-luna:        { input_per_million: 0.10,  output_per_million: 0.50 }
  claude-sonnet:     { input_per_million: 3.00,  output_per_million: 15.00 }
  claude-sonnet-5:   { input_per_million: 2.00,  output_per_million: 10.00 }
  claude-haiku:      { input_per_million: 1.00,  output_per_million: 5.00 }
  # add your models here
